name: _whoami (diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: Print SP appId (not a secret)
        shell: bash
        run: |
          APPID="$(az account show --query user.name -o tsv)"
          echo "APPID_SPACED=$(printf '%s' "$APPID" | sed 's/./& /g')"
          echo "TENANT=$(az account show --query tenantId -o tsv)"
