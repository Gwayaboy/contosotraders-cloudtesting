name: _whoami (diagnostic)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - name: Azure login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.SERVICEPRINCIPAL }}
      - name: Print SP appId (not a secret)
        shell: bash
        run: |
          APPID="$(az account show --query user.name -o tsv)"
          echo "SP displayName: $(az ad sp show --id "$APPID" --query displayName -o tsv)"
          echo "SP objectId: $(az ad sp show --id "$APPID" --query id -o tsv)"
          echo "Can invite? checking own appRoleAssignments for User.Invite.All…"
          OID="$(az ad sp show --id "$APPID" --query id -o tsv)"
          az rest --method GET --uri "https://graph.microsoft.com/v1.0/servicePrincipals/$OID/appRoleAssignments" --query "value[].appRoleId" -o tsv 2>&1 || echo "(cannot read own appRoleAssignments)"
